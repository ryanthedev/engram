// Engram service contract (walking-skeleton seam, locked in Phase 0).
//
// Ingest is the sync episodic append: cheap, durable, and the enqueue for the
// async write path (outbox, D12). event_id is REQUIRED — it is the client-
// supplied idempotency identity (D13); the server rejects an empty event_id
// with INVALID_ARGUMENT. proto3 cannot express required fields, so the
// requirement is enforced server-side and documented here.
//
// Search is the hybrid read path: BM25 + kNN fused by RRF (D1), scoped by
// tenancy filters (D16) and the bi-temporal current-state filter (D3).
//
// Authentication (Phase 3): every RPC is authenticated by a bearer token in
// the gRPC `authorization` metadata header, value "Bearer <raw-token>". A
// unary interceptor (the barricade) verifies the token, resolves the bound
// Identity{tenant_id, user_id, agent_id}, and injects it; unauthenticated
// calls are rejected with codes.Unauthenticated and an opaque message (no
// detail leak). The server derives tenancy/provenance from the resolved
// Identity, not from client-supplied fields, so a token cannot act outside
// its binding.
syntax = "proto3";

package engram.v1;

option go_package = "github.com/ryanthedev/engram/api/engrampb";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Engram is the agent-memory service: sync episodic ingest and hybrid search.
service Engram {
  // Ingest durably appends one event to episodic memory and returns its
  // storage id. The append is the enqueue: extraction and reconciliation
  // happen asynchronously (D4/D12). event_id is required; replays of the
  // same event_id are idempotent end-to-end via the extraction ledger (D13).
  rpc Ingest(IngestRequest) returns (IngestResponse);

  // Search runs one hybrid query (BM25 + kNN -> RRF) and returns a single
  // fused, ranked hit list.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Status reports server health, the caller's resolved identity, and coarse
  // tier document counts — the backing RPC for `engram status` and the MCP
  // memory_status tool. It requires a valid token like every other call.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Audit returns a fact's provenance (who wrote it, from what) and its full
  // bi-temporal version history (Phase 4, DW-4.6) — the backing RPC for
  // `engram audit <id>`. The caller must be authorized to READ the target
  // fact; an unauthorized or unknown id returns NOT_FOUND (no existence
  // oracle). Scope enforcement applies here exactly as it does to search.
  rpc Audit(AuditRequest) returns (AuditResponse);

  // Read returns ONE record's full content by (id, source) — the deliberate
  // drill-down behind the MCP memory_read tool. A full read spends the
  // caller's context, so it is a separate explicit call, never inlined into
  // Search. source selects the index dispatched to: "episodic" returns the
  // full raw event text, "semantic" returns the target fact version plus its
  // provenance and bi-temporal history (the Audit contract). Graph statements
  // are already whole in search hits, so "graph" is UNIMPLEMENTED. Read is a
  // by-id trust boundary: it runs the same fail-closed authorization as
  // Search/Audit — an unknown id, a cross-tenant record, an id/source
  // mismatch, or a record the caller may not read all return NOT_FOUND (no
  // existence oracle), and the handler never probes the other index.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Export returns one bounded page of the caller's tenant-scoped, live,
  // ACL-filtered graph (entities then edges) plus an opaque continuation
  // cursor — the backing RPC for `engram export <dir>`. The tenant is pinned
  // from the verified identity, never from the request; the cursor carries
  // NO tenancy and cannot reposition outside the caller's tenant. An empty
  // next_cursor means the graph is exhausted. Unary by design: it runs under
  // the same auth/telemetry interceptor chain as every other call.
  rpc Export(ExportRequest) returns (ExportResponse);

  // MemoryPurge erases ingested events from the memory tier by event_id — the
  // one sanctioned escape hatch from append-only ingest, for undoing a bad
  // bulk migration. It is deliberately NOT a general retraction primitive
  // (that is an ordinary `retract:` ingest, which adds a fact rather than
  // removing one).
  //
  // Mixed hard/soft by tier, and per tier for a reason: the episodic log and
  // the extraction ledger (D13) are HARD-deleted, because neither has a
  // liveness filter on its read paths — a tombstone there would be invisible
  // to the outbox scan, export, and read. Semantic facts are SOFT-deleted by
  // stamping expired_at (the transaction-time close, D3), because hard-
  // deleting them would dangle the supersedes chains Audit walks.
  //
  // Purging by event_id removes EVERY episodic doc carrying that id, so the
  // replay duplicates a retried Ingest creates (event_id does not deduplicate
  // the raw log) all go together. The graph tier is not touched here: rebuild
  // it with the engram-graph-rebuild tool. dry_run (the recommended default
  // for callers) counts what would be removed and mutates nothing.
  //
  // Requires the memory-admin role; the tenant is taken from the caller's
  // verified token and can never be named in the request.
  rpc MemoryPurge(MemoryPurgeRequest) returns (MemoryPurgeResponse);

  // --- Knowledge platform (document collections: BM25/FTS only, no fact
  // extraction, no embeddings; upsert-by-id + mark-and-sweep delete — the
  // documented deviation from memory's append-only writes). Every field shape
  // here is generic over collections: filters and sort name registry-mapped
  // fields, never source-specific ones.

  // KnowledgeIngest bulk-upserts one harvest batch of documents into a
  // collection. Rows are stamped server-side with harvest_id and harvested_at;
  // replays of the same document ids overwrite in place, so a failed batch is
  // safely retried whole.
  rpc KnowledgeIngest(KnowledgeIngestRequest) returns (KnowledgeIngestResponse);

  // KnowledgeSearch runs one BM25 query over a collection's text field with
  // generic field filters and sort. No kNN, no RRF, no memory-tier fusion.
  rpc KnowledgeSearch(KnowledgeSearchRequest) returns (KnowledgeSearchResponse);

  // KnowledgeCollections lists the collections the caller may read, each with
  // its field mappings (which fields are filterable/sortable), document count,
  // and staleness (newest harvested_at / newest document date).
  rpc KnowledgeCollections(KnowledgeCollectionsRequest) returns (KnowledgeCollectionsResponse);

  // KnowledgeDelete is the mark-and-sweep sweep: it hard-deletes every row in
  // the collection from the named source whose harvest_id differs from
  // current_harvest_id (rows the latest harvest run did not touch).
  rpc KnowledgeDelete(KnowledgeDeleteRequest) returns (KnowledgeDeleteResponse);

  // CreateCollection registers a new collection and provisions its backing
  // index live — no server restart. A duplicate name is ALREADY_EXISTS.
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);

  // UpdateCollection amends an existing collection's spec (new fields, access
  // policy); the registry applies mapping changes live.
  rpc UpdateCollection(UpdateCollectionRequest) returns (UpdateCollectionResponse);
}

// IngestRequest is one episodic event.
message IngestRequest {
  // Required. Client-supplied idempotency identity (D13). Empty -> INVALID_ARGUMENT.
  string event_id = 1;

  // Tenancy / provenance (D16); single-team values in the skeleton.
  string tenant_id = 2;
  string team_id = 3;
  string scope = 4;
  string owner_agent_id = 5;
  repeated string source_ids = 6;

  // Event classification (e.g. "tool_result", "conversation", "task").
  string kind = 7;
  // Raw event text; the extraction and BM25 target.
  string text = 8;
  // Real-world event time; the system stamps created_at itself (D3).
  google.protobuf.Timestamp occurred_at = 9;
}

// IngestResponse acknowledges the durable append.
message IngestResponse {
  // Durable episodic doc id.
  string id = 1;
}

// SearchRequest is one hybrid retrieval query.
//
// The filter fields (6-14) are FLAT and NAMED on purpose: the caller is an LLM,
// and a generic filters:[{field,op,value}] array costs more tokens to emit and
// offers more ways to be wrong. The generic predicate form (see Predicate,
// which knowledge_search uses) stays internal to the retrieval layer — the
// server compiles these named fields down to it. A flat wire contract also
// makes "a filter on a field no tier owns" unrepresentable rather than merely
// rejected.
//
// Every filter field is optional; an unset one adds no constraint. A request
// with none of them set is exactly the request this message carried before they
// existed.
message SearchRequest {
  // Query text; embedded for the kNN clause, matched for the BM25 clause.
  string query = 1;
  // Max fused results (default: server-chosen).
  int32 k = 2;
  // Tenancy scope filters (D16).
  string tenant_id = 3;
  string user_id = 4;

  // 5 was valid_only, a hardcoded-true bool with exactly one producer. It is
  // replaced by include_superseded (13), whose default (false) preserves the
  // same current-state filter — two knobs for one bit is one knob too many.
  reserved 5;
  reserved "valid_only";

  // Episodic event kind, exact match (episodic tier only).
  string kind = 6;
  // Semantic fact triple, exact match (semantic tier only).
  string subject = 7;
  string predicate = 8;
  string object = 9;
  // Extraction pipeline version that produced the fact (semantic tier only).
  string extractor_version = 10;
  // Inclusive time bounds on when the memory happened: episodic occurred_at,
  // semantic valid_at. Either bound may be unset (open interval).
  google.protobuf.Timestamp since = 11;
  google.protobuf.Timestamp until = 12;
  // Include superseded and retracted historical fact versions. Default (false)
  // restricts to currently-valid facts (invalid_at == null AND expired_at ==
  // null — the bi-temporal current-state filter). It relaxes the VALIDITY
  // filter only: tenancy and ACL scope are enforced independently and are
  // never widened by it.
  bool include_superseded = 13;
  // Restrict the search to these sources ("episodic", "semantic", plus any
  // registered source such as "experience" or "graph"). Unset searches every
  // source; an empty list is an error, not a silent "all". Sources that
  // declare no filterable fields cannot honor a filter, so they are excluded
  // from any search that sets one.
  repeated string sources = 14;
}

// Hit is one fused result.
message Hit {
  string id = 1;
  double score = 2;
  // Source index tier ("episodic" | "semantic" | "graph").
  string source = 3;
  // Stored document rendered as JSON.
  string fields_json = 4;
}

// SearchResponse carries the query's matched hits and, separately, the graph
// expansions that ride along beside them. The two blocks are never merged:
// `k` means k for MATCHED hits, and an expansion neither evicts a match nor
// inflates the count the caller asked for.
message SearchResponse {
  // The ranked matched hits: at most k of them, and never a graph expansion.
  repeated Hit hits = 1;
  // Graph expansions reached by traversing edges out of the matched hits
  // (source == "graph"). Bonus context, NOT counted against k, and empty
  // whenever expansion is disabled, finds nothing, or "graph" is excluded
  // from the request's sources. Every expansion is a per-call token cost on
  // the caller, so it is delimited here rather than smuggled into hits.
  repeated Hit expanded = 2;
}

// AuditRequest names one fact by its semantic doc id.
message AuditRequest {
  // Semantic fact doc id (as returned in a search Hit).
  string id = 1;
}

// Provenance is who wrote a fact and from what (D6 provenance-as-ACL).
message Provenance {
  string tenant_id = 1;
  string team_id = 2;
  string scope = 3;
  string owner_agent_id = 4;
  // Episodic event ids this fact was extracted from.
  repeated string source_ids = 5;
  // Extraction pipeline version that produced it (D13).
  string extractor_version = 6;
  // System append time of the audited version.
  google.protobuf.Timestamp created_at = 7;
  // Role claims of the writing identity (RBAC). Populated from the verified
  // token only — never from client-supplied request fields.
  repeated string roles = 8;
}

// FactVersion is one record in a fact's bi-temporal chain.
message FactVersion {
  string id = 1;
  string subject = 2;
  string predicate = 3;
  string object = 4;
  string statement = 5;
  string content_key = 6;
  // Doc id of the version this one supersedes (UPDATE/INVALIDATE); "" for ADD.
  string supersedes = 7;
  // Valid time [valid_at, invalid_at): real-world truth interval.
  google.protobuf.Timestamp valid_at = 8;
  google.protobuf.Timestamp invalid_at = 9;
  // Transaction time [created_at, expired_at): system currency interval.
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expired_at = 11;
}

// AuditResponse carries the target fact's provenance and its full history,
// ordered oldest-first by transaction then valid time.
message AuditResponse {
  Provenance provenance = 1;
  repeated FactVersion versions = 2;
}

// ReadRequest names one record by the (id, source) pair a search Hit exposes.
message ReadRequest {
  // Doc id exactly as surfaced by a search Hit. Empty -> INVALID_ARGUMENT.
  string id = 1;
  // Source the id lives in: "episodic" | "semantic", or a registered
  // knowledge collection name (the knowledge_search drill-down). Selects the
  // ONE index consulted (never both). Empty, or neither a memory tier nor a
  // registered collection -> INVALID_ARGUMENT; "graph" -> UNIMPLEMENTED (a
  // graph hit already carries its statement). Collection read authorization
  // is fail-closed server-side: an unreadable collection reads as NOT_FOUND.
  string source = 2;
}

// EpisodicRecord is one full episodic event as Read returns it: the record's
// content projection ONLY. ACL/provenance fields (tenant_id, team_id, scope,
// owner_agent_id) are authorized against server-side and then deliberately
// projected away (fetch -> authorize -> project); embeddings and outbox
// worker state never leave the store.
message EpisodicRecord {
  // Doc id (the address the caller passed).
  string id = 1;
  // Client-supplied idempotency identity (D13).
  string event_id = 2;
  // Event classification (e.g. "tool_result", "conversation", "task").
  string kind = 3;
  // Full, untruncated raw event text — the payload memory_read exists for.
  string text = 4;
  repeated string source_ids = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

// ReadResponse carries exactly one record: the branch matching the requested
// source is populated, the other stays unset.
message ReadResponse {
  // Echoes the request's source ("episodic" | "semantic").
  string source = 1;
  // Set when source=episodic.
  EpisodicRecord episodic = 2;
  // Set when source=semantic: the TARGET version itself (a superseded id
  // returns that immutable version with its possibly-closed validity
  // interval), plus its provenance and full bi-temporal history — the Audit
  // contract, reused.
  FactVersion fact = 3;
  Provenance provenance = 4;
  repeated FactVersion versions = 5;
  // Set when source is a knowledge collection: the full stored document as a
  // JSON object (every stored field, body included) — the drill-down target
  // for a knowledge_search hit whose body was suppressed in favor of
  // fragments. Mirrors KnowledgeHit.fields_json's encoding.
  string fields_json = 6;
}

// ExportRequest resumes a paged graph export. cursor is the opaque
// continuation token from the previous ExportResponse; empty starts from the
// beginning. Clients never construct or inspect a non-empty cursor.
message ExportRequest {
  string cursor = 1;
}

// ExportEntity is one live, deduplicated graph entity in an export page —
// the structured record the CLI renders into an Obsidian note. Internal
// fields (embedding, name_key) are deliberately not exported; tenant_id is
// omitted because every record is the caller's own tenant by construction.
message ExportEntity {
  string id = 1;
  // Canonical display name (first-seen surface form).
  string name = 2;
  // Every other merged surface form (dedup accounting).
  repeated string aliases = 3;
  int64 mention_count = 4;
  // Episodic event ids that contributed mentions (provenance).
  repeated string source_ids = 5;
  // Provenance / ACL fields (D6/D16).
  string scope = 6;
  string team_id = 7;
  string owner_agent_id = 8;
  google.protobuf.Timestamp valid_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

// ExportEdge is one live, predicate-typed relation in an export page. The
// endpoints are resolved entity ids (ExportEntity.id values).
message ExportEdge {
  string id = 1;
  string from_entity_id = 2;
  string to_entity_id = 3;
  string predicate = 4;
  // Natural-language rendering of the relation (from the source fact).
  string statement = 5;
  repeated string source_ids = 6;
  string scope = 7;
  string team_id = 8;
  string owner_agent_id = 9;
  google.protobuf.Timestamp valid_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

// ExportEpisodic is one processed, non-dead-lettered episodic record in an
// export page — the raw event prose the CLI renders into an event note.
// Internal fields (text_embedding, outbox worker state) are deliberately not
// exported; tenant_id is omitted because every record is the caller's own
// tenant by construction.
message ExportEpisodic {
  // Client-supplied idempotency identity (D13) — the join key the CLI uses
  // to resolve entity/edge source_ids back to their source event.
  string event_id = 1;
  // Event classification (e.g. "tool_result", "conversation").
  string kind = 2;
  // Raw event payload (unbounded — the episodic page is byte-budgeted).
  string text = 3;
  // Real-world event time.
  google.protobuf.Timestamp occurred_at = 4;
  repeated string source_ids = 5;
  // Provenance / ACL fields (D6/D16).
  string scope = 6;
  string team_id = 7;
  string owner_agent_id = 8;
}

// ExportResponse is one bounded page: episodics first, then entities, then
// edges (a page may span tiers when a tier exhausts mid-call). An empty
// next_cursor means the export is complete.
message ExportResponse {
  repeated ExportEntity entities = 1;
  repeated ExportEdge edges = 2;
  string next_cursor = 3;
  repeated ExportEpisodic episodics = 4;
}

// MemoryPurgeRequest names the events to erase. There is deliberately no
// tenant field: the tenant is pinned from the caller's verified token, so a
// token can never purge outside its own binding. event_ids is capped
// server-side (500 per call) and every entry must be non-blank.
message MemoryPurgeRequest {
  repeated string event_ids = 1;
  // dry_run counts what would be removed without mutating anything.
  bool dry_run = 2;
}

// MemoryPurgeResponse reports per-tier totals summed over every requested
// event id. Zero matches is a successful purge of nothing, not an error.
message MemoryPurgeResponse {
  // episodic is the number of raw episodic docs hard-deleted (replay
  // duplicates sharing one event_id each count individually).
  int64 episodic = 1;
  // ledger is the number of extraction-ledger rows hard-deleted, so a
  // re-ingest of the same event_id re-extracts cleanly instead of
  // short-circuiting on the completed ledger entry (D13).
  int64 ledger = 2;
  // semantic is the number of facts soft-deleted by stamping expired_at.
  // Already-tombstoned facts are not re-stamped and do not count.
  int64 semantic = 3;
  // dry_run echoes the request: true means nothing was mutated.
  bool dry_run = 4;
}

// PredicateOp is the closed set of generic filter operations a Predicate can
// apply to a registry-mapped field.
enum PredicateOp {
  PREDICATE_OP_UNSPECIFIED = 0;
  // Exact match on a filterable field.
  PREDICATE_OP_TERM = 1;
  // Bounded match (gte/lte) via the predicate's Range value.
  PREDICATE_OP_RANGE = 2;
  // Leading-substring match on a filterable field.
  PREDICATE_OP_PREFIX = 3;
}

// SortOrder is the direction of one SortKey.
enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

// Range bounds a RANGE predicate. Either bound may be unset (open interval);
// bounds are google.protobuf.Value so numbers, dates-as-strings, and other
// scalars travel without a per-type field.
message Range {
  google.protobuf.Value gte = 1;
  google.protobuf.Value lte = 2;
}

// Predicate is one generic field filter: TERM and PREFIX carry a scalar,
// RANGE carries a Range. The field must be declared filterable in the
// collection's mappings; an unknown field is INVALID_ARGUMENT naming the
// valid filterable fields.
message Predicate {
  string field = 1;
  PredicateOp op = 2;
  oneof value {
    google.protobuf.Value scalar = 3;
    Range range = 4;
  }
}

// SortKey orders results by one sortable field.
message SortKey {
  string field = 1;
  SortOrder order = 2;
}

// FieldSpec declares one collection field: its index type (OpenSearch type
// name, e.g. "keyword", "date", "integer") and whether queries may filter or
// sort on it.
message FieldSpec {
  string type = 1;
  bool filterable = 2;
  bool sortable = 3;
}

// AccessPolicy is a collection's read gate: public (any authenticated caller)
// or restricted to callers holding one of the named roles. Writes always
// require the harvester/admin role, independent of this policy.
message AccessPolicy {
  bool public = 1;
  repeated string roles = 2;
}

// CollectionSpec describes one document collection. It deliberately carries
// no index or alias name — physical storage is registry-internal.
message CollectionSpec {
  string name = 1;
  // The full-text field BM25 queries target.
  string text_field = 2;
  // Declared document fields by name.
  map<string, FieldSpec> mappings = 3;
  AccessPolicy access = 4;
  // Fragment sizing for search-time highlight extraction. 0 means UNSET —
  // the server applies its global defaults (240 chars / 3 fragments) —
  // never a literal zero-size fragment.
  int32 fragment_size = 5;
  int32 number_of_fragments = 6;
  // Marker strings wrapped around the matched terms inside each fragment.
  // Both empty (the default) means markers OFF: clean extraction. Markers
  // are a per-collection opt-in; the server never hardcodes a marker pair.
  string highlight_pre_tag = 7;
  string highlight_post_tag = 8;
}

// KnowledgeDocument is one document in an ingest batch. fields carries the
// collection-specific values matching the spec's mappings; the platform
// itself has no per-source schema.
message KnowledgeDocument {
  // Required: the upsert identity. Re-ingesting an id overwrites in place.
  string id = 1;
  string title = 2;
  // The full-text body indexed under the collection's text_field.
  string text = 3;
  // Source-side version marker for change detection (opaque to the server).
  string source_version = 4;
  google.protobuf.Struct fields = 5;
}

// KnowledgeIngestRequest is one harvest batch: every document comes from one
// (collection, source, harvest_id) run — the mark-and-sweep unit.
message KnowledgeIngestRequest {
  string collection = 1;
  // Logical origin of the batch (which harvester/feed wrote it).
  string source = 2;
  // Identifier of this harvest run; stamped onto every row for the sweep.
  string harvest_id = 3;
  repeated KnowledgeDocument docs = 4;
}

// KnowledgeIngestResponse acknowledges the upserted batch. Partial failures
// surface as an RPC error (retrying the whole batch is idempotent).
message KnowledgeIngestResponse {
  int32 indexed = 1;
}

// KnowledgeSearchRequest is one BM25 query over a collection.
message KnowledgeSearchRequest {
  string collection = 1;
  // Query text; empty with filters set means a filter-only search.
  string query = 2;
  repeated Predicate filters = 3;
  repeated SortKey sort = 4;
  // Max results (default: server-chosen; clamped server-side).
  int32 k = 5;
  // Paging start: skip this many ranked hits before returning k. 0 (the
  // proto default) means the first page — "unset" and "page one" are the
  // same thing, so there is no sentinel to get wrong.
  int32 offset = 6;
  // Return each hit's full stored body inline (today's pre-fragment
  // behavior) instead of extracted fragments. Defaults to false: fragments
  // are the medium, the body is the drill-down (memory_read by id).
  bool full_body = 7;
}

// KnowledgeHit is one knowledge-search result. It is deliberately NOT the
// memory Hit: knowledge hits carry a real collection name (memory's Hit
// overloads source as an index-tier tag) and extracted fragments, and a
// memory hit must never grow a permanently-empty fragments field.
message KnowledgeHit {
  string id = 1;
  double score = 2;
  // The collection this hit came from.
  string collection = 3;
  // The stored document rendered as JSON (scalars only by default; the
  // full-text body is included only for full_body searches).
  string fields_json = 4;
  // Fragments extracted from the full-text body around the query matches.
  // Empty for a filter-only search or when full_body inlines the body instead.
  repeated string fragments = 5;
}

// KnowledgeSearchResponse carries one page of ranked knowledge hits.
message KnowledgeSearchResponse {
  repeated KnowledgeHit hits = 1;
  // Exact total number of matches across all pages (0 until offset paging
  // wires track_total_hits; then never a capped estimate).
  int64 total = 2;
}

// KnowledgeCollectionsRequest is empty; the caller is identified by the
// bearer token and sees only collections it may read.
message KnowledgeCollectionsRequest {}

// CollectionInfo is one listed collection: its spec (so a caller can learn
// the filterable/sortable fields), size, and staleness.
message CollectionInfo {
  CollectionSpec spec = 1;
  int64 count = 2;
  // Newest server-stamped harvest time (unset when the collection is empty).
  google.protobuf.Timestamp newest_harvested_at = 3;
  // Newest document-declared date (unset when absent).
  google.protobuf.Timestamp newest_doc_date = 4;
}

// KnowledgeCollectionsResponse lists readable collections.
message KnowledgeCollectionsResponse {
  repeated CollectionInfo collections = 1;
}

// KnowledgeDeleteRequest is the mark-and-sweep predicate: delete rows in
// collection from source whose harvest_id != current_harvest_id.
message KnowledgeDeleteRequest {
  string collection = 1;
  string source = 2;
  string current_harvest_id = 3;
}

// KnowledgeDeleteResponse reports the sweep. Zero matches is deleted: 0, not
// an error.
message KnowledgeDeleteResponse {
  int64 deleted = 1;
}

// CreateCollectionRequest registers spec as a new collection.
message CreateCollectionRequest {
  CollectionSpec spec = 1;
}

// CreateCollectionResponse is empty: creation is acknowledged by success.
message CreateCollectionResponse {}

// UpdateCollectionRequest replaces the named collection's spec (spec.name
// selects the collection).
message UpdateCollectionRequest {
  CollectionSpec spec = 1;
}

// UpdateCollectionResponse is empty: the update is acknowledged by success.
message UpdateCollectionResponse {}

// StatusRequest is empty; the caller is identified by the bearer token.
message StatusRequest {}

// StatusResponse reports liveness, the resolved identity, and tier counts.
message StatusResponse {
  // healthy is true when the backing store answered the count probe.
  bool healthy = 1;
  // Resolved identity of the caller (from the verified token).
  string tenant_id = 2;
  string user_id = 3;
  string agent_id = 4;
  // Coarse per-tier document counts for the caller's tenant.
  int64 episodic_count = 5;
  int64 semantic_count = 6;
  // OpenSearch version line the server is pinned to (D14).
