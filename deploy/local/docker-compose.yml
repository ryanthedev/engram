# Local end-to-end stack (D21): pinned OpenSearch 3.1, a deterministic
# embedding server (BGE-M3 stand-in), a deterministic stub extraction LLM, and
# engramd (gRPC + outbox worker + repair sweep + auth barricade). Drive it with
# podman (`make e2e`) or docker. Ports and the container name are deliberately
# distinct from the dev cluster (engram-dev-os on :9200) so this stack never
# collides with a running dev OpenSearch.
#
# Cold-start ordering is gated by healthchecks: engramd waits for OpenSearch,
# the embedding server, and the stub LLM to be healthy before it starts.
services:
  opensearch:
    image: opensearchproject/opensearch:3.1.0 # pinned — D14
    container_name: engram-e2e-os
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  embed:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: engram-local
    command: ["engram-embed-server", "-addr", ":8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  stub-llm:
    image: engram-local
    command: ["engram-stub-llm", "-addr", ":8082"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  engramd:
    image: engram-local
    command:
      - "engram-server"
      - "-addr"
      - ":7070"
      - "-url"
      - "http://opensearch:9200"
      - "-embed-url"
      - "http://embed:8081"
      - "-extract-url"
      # cmd/engram-extract-shim runs on the HOST (it shells out to CLI
      # backends — agy/codex/claude — whose auth lives there), not as a
      # compose service. host.docker.internal resolves it from inside the
      # container; extra_hosts below makes that resolve on Linux too, where
      # Docker Desktop's automatic mapping isn't present. See
      # .code-foundations/research/2026-07-08-extraction-cli-shim.md.
      - "http://host.docker.internal:8088"
      - "-poll-interval"
      - "500ms"
      - "-sweep-interval"
      - "2s"
      - "-enrich-interval"
      - "500ms"
      - "-extractor-version"
      # Bumped v1 -> v2 to re-key the ledger for the Phase 2 backfill
      # (.code-foundations/plans/2026-07-08-extraction-cli-shim.md): the
      # already-processed rtd events are re-claimed via a scoped
      # processed_at reset (scripts/backfill-reextract-rtd.sh) and the v2
      # ledger key ensures they actually re-extract instead of short-
      # circuiting on the existing v1 LedgerComplete entries.
      #
      # Bumped v2 -> v3 for the ensemble deep-re-extract Phase 2
      # (.code-foundations/plans/2026-07-08-ensemble-extraction.md): the shim
      # now runs -backend ensemble (agy + codex candidates, sonnet-5 judge)
      # on :8088; the same scoped processed_at reset re-claims the rtd
      # events, and the v3 ledger key forces real re-extraction instead of
      # short-circuiting on the existing v2 LedgerComplete entries.
      - "v3"
    ports:
      - "7071:7070" # host 7071 -> engramd 7070 (distinct from a dev engramd on 7070)
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux portability; no-op on Docker Desktop
    depends_on:
      opensearch:
        condition: service_healthy
      embed:
        condition: service_healthy
      # stub-llm's own healthcheck dependency is intentionally dropped: the
      # host-side extract-shim isn't a compose service and has no compose
      # healthcheck to gate on. Extraction calls retry on failure, so a
      # briefly-unreachable shim is tolerable at cold start.
    healthcheck:
      # engramd has no HTTP health endpoint; a TCP probe on the gRPC port is
      # enough for compose to gate readiness.
      test: ["CMD-SHELL", "nc -z localhost 7070 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
