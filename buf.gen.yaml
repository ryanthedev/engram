# Codegen runs entirely through version-pinned `go run` plugins — no host
# protoc/buf installs; CI and dev machines produce identical output.
# Regenerate with: make proto   (or scripts/codegen.sh)
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6"]
    out: api/engrampb
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1"]
    out: api/engrampb
    opt: paths=source_relative
